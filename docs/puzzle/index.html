<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puzzle Generator - jigsaw cut files for the laser</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🧩</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">🧩</span>
      <input id="projectName" class="name-input" value="Untitled puzzle" spellcheck="false" aria-label="Project name">
      <span id="status" class="status">Saved</span>
    </div>

    <div class="midbar">
      <button class="ghost" id="shuffleBtn" title="New random piece shapes">
        ↻ Shuffle shapes</button>
    </div>

    <div class="actions">
      <button class="icon-btn" id="undoBtn" title="Undo (Ctrl+Z)">↶</button>
      <button class="icon-btn" id="redoBtn" title="Redo (Ctrl+Shift+Z)">↷</button>
      <button class="icon-btn" id="helpBtn" title="How to cut this">?</button>
      <button class="primary" id="exportBtn">Export</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage" id="stage">
      <div id="stagePreview" class="stage-pane"></div>
      <div class="backdrop-pick" id="backdropPick" role="group" aria-label="Preview backdrop"></div>
      <div class="stage-hint" id="stageHint"></div>
    </section>

    <aside class="inspector" id="inspector"></aside>
  </main>
</div>

<dialog id="exportDlg" class="dlg">
  <form method="dialog" class="dlg-body">
    <h2>Export for the laser</h2>
    <p class="muted" id="exportSummary"></p>
    <label class="check"><input type="checkbox" id="splitChk"> Separate the horizontal and vertical lines onto their own layers</label>
    <div class="layer-key" id="layerKey"></div>
    <p class="note" id="exportNote"></p>
    <div class="dlg-actions">
      <button value="cancel" class="ghost">Cancel</button>
      <button value="all" class="primary" id="dlAll">Download SVG</button>
    </div>
  </form>
</dialog>

<dialog id="helpDlg" class="dlg">
  <form method="dialog" class="dlg-body">
    <h2>How to cut this</h2>
    <ol class="steps" id="helpSteps"></ol>
    <div class="dlg-actions"><button value="ok" class="primary">Got it</button></div>
  </form>
</dialog>

<script type="module" src="src/main.js"></script>
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "64b33f01984840f982c28feb1569fb91"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
