<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Box Maker - parametric laser-cut boxes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📦</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">▣</span>
      <input id="projectName" class="name-input" value="Untitled box" spellcheck="false" aria-label="Project name">
      <span id="status" class="status">Saved</span>
    </div>

    <div class="viewtoggle" role="tablist">
      <button class="vt" data-view="3d" role="tab" aria-selected="true">3D Design</button>
      <button class="vt" data-view="2d" role="tab" aria-selected="false">2D Design</button>
    </div>

    <div class="actions">
      <button class="icon-btn" id="undoBtn" title="Undo (Ctrl+Z)">↶</button>
      <button class="icon-btn" id="redoBtn" title="Redo (Ctrl+Shift+Z)">↷</button>
      <button class="icon-btn" id="assembleBtn" title="How to assemble">?</button>
      <button class="primary" id="exportBtn">Export</button>
    </div>
  </header>

  <main class="layout">
    <aside class="tools" id="tools" hidden>
      <button class="tool" data-tool="image"><span>🖼</span>Image</button>
      <button class="tool" data-tool="text"><span>T</span>Text</button>
      <button class="tool" data-tool="emoji"><span>☺</span>Emoji</button>
      <button class="tool" data-tool="shape"><span>◇</span>Shape</button>
      <div class="tool-spacer"></div>
      <button class="tool" data-tool="fit"><span>⤢</span>Fit</button>
      <button class="tool danger" data-tool="delete"><span>🗑</span>Delete</button>
    </aside>

    <section class="stage">
      <div id="stage3d" class="stage-pane"></div>
      <div id="stage2d" class="stage-pane" hidden></div>

      <div class="stage-hint" id="stageHint">Click a face to edit it in 2D</div>
      <button class="lid-btn" id="lidBtn" hidden>Open the box</button>

      <nav class="faces" id="faces"></nav>
    </section>

    <aside class="inspector" id="inspector"></aside>
  </main>
</div>

<div class="popover" id="popover" hidden></div>

<dialog id="exportDlg" class="dlg">
  <form method="dialog" class="dlg-body">
    <h2>Export for the laser</h2>
    <p class="muted" id="exportSummary"></p>
    <div class="field">
      <label for="sheetSel">Sheet</label>
      <select id="sheetSel"></select>
    </div>
    <label class="check"><input type="checkbox" id="labelsChk" checked> Etch panel names (grey layer, delete before cutting)</label>
    <div class="layer-key">
      <span><i style="background:#e5484d"></i>Cut</span>
      <span><i style="background:#3b82f6"></i>Engrave (Line)</span>
      <span><i style="background:#1f2328"></i>Engrave (Fill)</span>
    </div>
    <p class="note" id="exportNote"></p>
    <div class="dlg-actions">
      <button value="cancel" class="ghost">Cancel</button>
      <button value="panel" class="ghost" id="dlPanel">This panel only</button>
      <button value="all" class="primary" id="dlAll">Download SVG</button>
    </div>
  </form>
</dialog>

<dialog id="assembleDlg" class="dlg">
  <form method="dialog" class="dlg-body">
    <h2>How to assemble</h2>
    <ol class="steps" id="assembleSteps"></ol>
    <div class="dlg-actions"><button value="ok" class="primary">Got it</button></div>
  </form>
</dialog>

<script type="module" src="src/main.js"></script>
</body>
</html>
