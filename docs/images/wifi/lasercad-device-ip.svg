<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="440" height="320" fill="#e8e8e8"/>
  <!-- Dialog -->
  <rect x="40" y="30" width="360" height="260" fill="#f5f5f5" stroke="#999"/>
  <rect x="41" y="31" width="358" height="38" fill="#ffffff"/>
  <text x="60" y="56" font-size="16" fill="#444">Device IP</text>
  <text x="376" y="56" font-size="16" fill="#444" text-anchor="middle">✕</text>
  <line x1="41" y1="69" x2="399" y2="69" stroke="#ddd"/>
  <!-- DeviceName field -->
  <text x="66" y="112" font-size="15" fill="#222">DeviceName:</text>
  <rect x="178" y="92" width="196" height="30" fill="#ffffff" stroke="#7a7a7a"/>
  <text x="188" y="112" font-size="15" fill="#111">MachineTest</text>
  <!-- IP field -->
  <text x="66" y="168" font-size="15" fill="#222">IP:</text>
  <rect x="178" y="148" width="196" height="30" fill="#ffffff" stroke="#7a7a7a"/>
  <text x="276" y="168" font-size="15" fill="#111" text-anchor="middle">192 . 168 . 1 . 17</text>
  <!-- Buttons -->
  <g font-size="14" text-anchor="middle">
    <rect x="106" y="216" width="100" height="32" rx="4" fill="#0067c0"/>
    <text x="156" y="237" fill="#ffffff">OK</text>
    <rect x="234" y="216" width="100" height="32" rx="4" fill="#fdfdfd" stroke="#adadad"/>
    <text x="284" y="237" fill="#222">Cancel</text>
  </g>
</svg>
