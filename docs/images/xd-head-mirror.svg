<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 549" role="img" aria-label="Head XD Laser dengan tiga skru pelarasan">
  <defs>
    <radialGradient id="brass" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#f0d382"/>
      <stop offset="45%" stop-color="#c9a127"/>
      <stop offset="100%" stop-color="#7a5f16"/>
    </radialGradient>
    <radialGradient id="mirror" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#eceae4"/>
      <stop offset="100%" stop-color="#cfccc2"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1b1d"/>
      <stop offset="55%" stop-color="#0d0d0f"/>
      <stop offset="100%" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8f959d"/>
      <stop offset="45%" stop-color="#dfe3e8"/>
      <stop offset="100%" stop-color="#7c828b"/>
    </linearGradient>
  </defs>

  <!-- Badan mount -->
  <rect x="10" y="6" width="430" height="537" rx="12" fill="url(#body)"/>
  <rect x="10" y="6" width="430" height="537" rx="12" fill="none" stroke="#2b2b2e" stroke-width="2"/>
  <!-- Lubang skru atas -->
  <circle cx="150" cy="16" r="9" fill="#050505" stroke="#2a2a2c" stroke-width="1.5"/>
  <circle cx="315" cy="16" r="9" fill="#050505" stroke="#2a2a2c" stroke-width="1.5"/>

  <!-- Boss bulat tengah dengan cermin -->
  <circle cx="228" cy="252" r="128" fill="#1f1f22" stroke="#000" stroke-width="3"/>
  <circle cx="228" cy="252" r="128" fill="none" stroke="#3a3a3e" stroke-width="1.2"/>
  <circle cx="228" cy="252" r="96" fill="#161618" stroke="#050505" stroke-width="2"/>
  <circle cx="228" cy="252" r="60" fill="url(#mirror)" stroke="#0a0a0a" stroke-width="3"/>
  <!-- Pin pengapit cermin -->
  <circle cx="176" cy="186" r="8" fill="#0a0a0a"/>
  <circle cx="176" cy="186" r="8" fill="none" stroke="#333" stroke-width="1"/>
  <circle cx="296" cy="210" r="8" fill="#0a0a0a"/>
  <circle cx="296" cy="210" r="8" fill="none" stroke="#333" stroke-width="1"/>
  <circle cx="196" cy="322" r="8" fill="#0a0a0a"/>
  <circle cx="196" cy="322" r="8" fill="none" stroke="#333" stroke-width="1"/>
  <circle cx="278" cy="325" r="5" fill="#0a0a0a"/>

  <!-- Spring skru 2 (kiri bawah) -->
  <g stroke="url(#steel)" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M40 300 h36 m-36 14 h36 m-36 14 h36 m-36 14 h36 m-36 14 h36 m-36 14 h36"/>
  </g>
  <ellipse cx="58" cy="355" rx="17" ry="20" fill="url(#steel)" opacity="0.95"/>
  <circle cx="58" cy="349" r="7" fill="#e8ebee"/>

  <!-- Spring skru 3 (bawah kanan, condong sedikit) -->
  <g stroke="url(#steel)" stroke-width="6.5" fill="none" stroke-linecap="round" transform="rotate(8 278 425)">
    <path d="M252 392 h34 m-34 13 h34 m-34 13 h34 m-34 13 h34 m-34 13 h34"/>
  </g>
  <ellipse cx="283" cy="452" rx="15" ry="18" fill="url(#steel)" opacity="0.95" transform="rotate(8 283 452)"/>
  <circle cx="283" cy="447" r="6" fill="#e8ebee"/>

  <!-- Tombol tembaga: Skru 1 (atas kiri) -->
  <g>
    <circle cx="60" cy="88" r="50" fill="url(#brass)"/>
    <circle cx="60" cy="88" r="50" fill="none" stroke="#5c4710" stroke-width="3" stroke-dasharray="4 3"/>
    <circle cx="60" cy="88" r="36" fill="none" stroke="#8a6d1a" stroke-width="2"/>
    <line x1="30" y1="88" x2="90" y2="88" stroke="#5c4710" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Tombol tembaga: Skru 2 (bawah kiri) -->
  <g>
    <circle cx="58" cy="430" r="50" fill="url(#brass)"/>
    <circle cx="58" cy="430" r="50" fill="none" stroke="#5c4710" stroke-width="3" stroke-dasharray="4 3"/>
    <circle cx="58" cy="430" r="36" fill="none" stroke="#8a6d1a" stroke-width="2"/>
    <line x1="28" y1="430" x2="88" y2="430" stroke="#5c4710" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Tombol tembaga: Skru 3 (bawah kanan) -->
  <g>
    <circle cx="385" cy="455" r="52" fill="url(#brass)"/>
    <circle cx="385" cy="455" r="52" fill="none" stroke="#5c4710" stroke-width="3" stroke-dasharray="4 3"/>
    <circle cx="385" cy="455" r="38" fill="none" stroke="#8a6d1a" stroke-width="2"/>
    <line x1="353" y1="455" x2="417" y2="455" stroke="#5c4710" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
