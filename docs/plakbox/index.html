<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plak Box - tapak cetak 3D dan kotak akrilik</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#9635;</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">&#9635;</span>
      <span class="app-name">Plak Box</span>
    </div>

    <div class="midbar">
      <div class="viewtoggle" role="tablist" aria-label="Paparan">
        <!-- Label pendek di skrin sempit. Paparan "Akrilik diangkat" dahulu
             tab ketiga; kini butang #liftBtn yang beranimasi di atas pentas. -->
        <button class="vt" data-show="siap" role="tab" aria-selected="true">Siap</button>
        <button class="vt" data-show="tapak" role="tab" aria-selected="false" title="Tapak sahaja"><span class="long">Tapak sahaja</span><span class="short">Tapak</span></button>
      </div>
    </div>

    <div class="actions">
      <span class="muted" id="sizeReadout"></span>
      <button class="icon-btn" id="helpBtn" title="Cara pasang">?</button>
      <button class="soft" id="saveBtn">Simpan</button>
      <button class="ghost quiet" id="filesBtn" title="Reka bentuk saya" aria-label="Reka bentuk saya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="files-label">Reka bentuk saya</span></button>
      <!-- id="exportBtn" ialah keseluruhan kewajipan alat ini kepada
           /shared/export-gate.js, yang memadankan target.closest('#exportBtn')
           pada pendengar fasa tangkap. -->
      <button class="primary" id="exportBtn">Export</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage" id="stage" data-backdrop="light">
      <div id="stage3d" class="stage-pane"></div>
      <div class="backdrop-pick" id="backdropPick" role="group" aria-label="Latar belakang"></div>
      <button class="frame-btn" id="frameBtn" title="Tengok semula keseluruhan">&#8982;</button>
      <!-- Angkat kotak akrilik / cabut plak dari slot - label diisi src/main.js. -->
      <button class="lift-btn" id="liftBtn" type="button" aria-pressed="false"></button>
      <div class="warnings" id="warnings" hidden></div>
      <div class="stage-hint" id="stageHint"></div>
    </section>

    <aside class="inspector" id="inspector"></aside>
  </main>
</div>

<dialog id="exportDlg" class="dlg dlg-wide">
  <form method="dialog" class="dlg-body">
    <h2>Export</h2>
    <!-- Reka bentuk disimpan sendiri ke akaun bila Export dibuka - src/main.js. -->
    <p class="note" id="exportSaved" hidden></p>
    <section class="exp-part">
      <!-- Tajuk ikut mod tapak: cetak 3D (STL) atau potong laser (SVG / PDF). -->
      <h3 id="baseExportTitle">Tapak &middot; cetak 3D (STL)</h3>
      <p class="muted" id="exportSummary"></p>
      <p class="note" id="exportNote"></p>
      <!-- Butang muat turun dijana ikut senarai jasad model (kini satu). -->
      <div class="dlg-actions start" id="exportActions"></div>
      <!-- Mod potong laser: saiz katil, kerf, tanda, pratonton helaian lapisan. -->
      <div class="acr-export" id="baseExport" hidden></div>
    </section>
    <section class="exp-part">
      <h3>Kotak akrilik &middot; potong laser (SVG / PDF)</h3>
      <!-- Saiz katil, kerf, label, pratonton helaian dan butang - src/main.js. -->
      <div class="acr-export" id="acrylicExport"></div>
    </section>
    <div class="dlg-actions"><button value="close" class="ghost">Tutup</button></div>
  </form>
</dialog>

<dialog id="saveDlg" class="dlg"></dialog>
<dialog id="filesDlg" class="dlg"></dialog>

<dialog id="helpDlg" class="dlg">
  <form method="dialog" class="dlg-body">
    <h2>Cara pasang</h2>
    <ol class="steps" id="assembleSteps"></ol>
    <div class="dlg-actions"><button value="ok" class="primary">Faham</button></div>
  </form>
</dialog>

<script type="module" src="src/main.js"></script>
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "64b33f01984840f982c28feb1569fb91"}'></script><!-- End Cloudflare Web Analytics -->
<!-- Daftar masuk sebelum muat turun. Dihidangkan dari laman, jadi tiada bila
     alat dijalankan sendiri semasa pembangunan - dan tiada bermakna export
     berfungsi, iaitu cara yang betul untuk corong gagal. -->
<script type="module" src="/shared/export-gate.js"></script>
</body>
</html>
