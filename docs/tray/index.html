<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tray Organizer - dulang berpetak untuk laser</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#9638;</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">&#9638;</span>
      <input id="projectName" class="name-input" value="Dulang tanpa nama" spellcheck="false" aria-label="Nama projek">
      <span id="status" class="status">Disimpan</span>
    </div>

    <div class="midbar">
      <div class="viewtoggle" role="tablist" aria-label="Paparan">
        <button class="vt" id="v3d" role="tab" aria-selected="true">3D</button>
        <button class="vt" id="v2d" role="tab" aria-selected="false">Rata</button>
      </div>
    </div>

    <div class="actions">
      <span class="muted" id="sizeReadout"></span>
      <button class="icon-btn" id="undoBtn" title="Undo (Ctrl+Z)">&#8630;</button>
      <button class="icon-btn" id="redoBtn" title="Redo (Ctrl+Shift+Z)">&#8631;</button>
      <button class="icon-btn" id="helpBtn" title="Cara pasang">?</button>
      <!-- id="exportBtn" ialah keseluruhan kewajipan alat ini kepada
           /shared/export-gate.js, yang memadankan target.closest('#exportBtn')
           pada pendengar fasa tangkap. -->
      <button class="primary" id="exportBtn">Export</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage" id="stage" data-backdrop="light">
      <div id="stage3d" class="stage-pane"></div>
      <div id="stage2d" class="stage-pane" hidden></div>
      <div class="backdrop-pick" id="backdropPick" role="group" aria-label="Latar belakang"></div>
      <button class="frame-btn" id="frameBtn" title="Tengok semula keseluruhan dulang">&#8982;</button>
      <div class="warnings" id="warnings" hidden></div>
      <div class="stage-hint" id="stageHint"></div>
    </section>

    <aside class="inspector" id="inspector"></aside>
  </main>
</div>

<dialog id="exportDlg" class="dlg">
  <form method="dialog" class="dlg-body">
    <h2>Export untuk laser</h2>
    <p class="muted" id="exportSummary"></p>
    <div class="field">
      <label for="sheetSel">Kepingan</label>
      <select id="sheetSel"></select>
    </div>
    <label class="check"><input type="checkbox" id="labelsChk" checked> Ukir nama panel (lapisan kelabu, padam sebelum potong kalau tak mahu)</label>
    <div class="layer-key">
      <span><i style="background:#e5484d"></i>Potong</span>
      <span><i style="background:#9aa0a6"></i>Label</span>
    </div>
    <p class="note" id="exportNote"></p>
    <div class="dlg-actions">
      <button value="cancel" class="ghost">Batal</button>
      <button value="svg" class="primary">Muat turun SVG</button>
    </div>
  </form>
</dialog>

<dialog id="helpDlg" class="dlg">
  <form method="dialog" class="dlg-body">
    <h2>Cara pasang</h2>
    <ol class="steps" id="assembleSteps"></ol>
    <p class="muted">Tenon direka dengan interference fit 0.05 mm - ketuk perlahan dengan tukul getah; jangan paksa. Kalau terlalu ketat, kerf mesin anda lebih kecil daripada yang ditetapkan: ukur dan tukar dalam Bahan &rarr; Bahan sendiri.</p>
    <div class="dlg-actions"><button value="ok" class="primary">Faham</button></div>
  </form>
</dialog>

<script type="module" src="src/main.js"></script>
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "64b33f01984840f982c28feb1569fb91"}'></script><!-- End Cloudflare Web Analytics -->
<!-- Daftar masuk sebelum muat turun. Dihidangkan dari laman, jadi tiada bila
     alat dijalankan sendiri semasa pembangunan - dan tiada bermakna export
     berfungsi, iaitu cara yang betul untuk corong gagal. -->
<script type="module" src="/shared/export-gate.js"></script>
</body>
</html>
