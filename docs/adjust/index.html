<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Template Adjuster - refit a downloaded SVG to the material you have</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📐</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">▤</span>
      <input id="projectName" class="name-input" value="Untitled refit" spellcheck="false" aria-label="Project name">
      <span id="status" class="status">Saved</span>
    </div>

    <div class="midbar">
      <span class="tally" id="tally"></span>
    </div>

    <div class="actions">
      <span class="muted" id="sizeReadout"></span>
      <button class="icon-btn" id="undoBtn" title="Undo (Ctrl+Z)">↶</button>
      <button class="icon-btn" id="redoBtn" title="Redo (Ctrl+Shift+Z)">↷</button>
      <button class="icon-btn" id="helpBtn" title="What the two knobs do">?</button>
      <button class="primary" id="exportBtn">Export</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage" id="stage">
      <div id="stagePreview" class="stage-pane"></div>
      <div class="drop-veil" id="dropVeil" hidden>Drop an SVG to refit it</div>
      <div class="empty-state" id="emptyState">
        <h1>Refit a downloaded template</h1>
        <p>Drop an SVG here, or open one. Then set the size you want and the board
           you actually have - they are two separate knobs, and a joinery file
           needs both.</p>
        <div class="empty-actions">
          <button class="primary" id="openBtn2">Open an SVG</button>
          <button class="ghost" id="sampleBtn2">Load a sample</button>
        </div>
      </div>
      <div class="backdrop-pick" id="backdropPick" role="group" aria-label="Preview backdrop"></div>
      <div class="warnings" id="warnings" hidden></div>
    </section>

    <aside class="inspector" id="inspector"></aside>
  </main>
</div>

<input type="file" id="fileInput" accept=".svg,image/svg+xml" hidden>

<dialog id="exportDlg" class="dlg">
  <form method="dialog" class="dlg-body">
    <h2>Export</h2>
    <p class="muted" id="exportSummary"></p>
    <div id="exportOpts"></div>
    <div class="layer-key" id="layerKey"></div>
    <p class="note" id="exportNote"></p>
    <div class="dlg-actions">
      <button value="cancel" class="ghost">Cancel</button>
      <button value="pdf" class="ghost wide" id="dlPdf">Download PDF</button>
      <button value="svg" class="primary" id="dlSvg">Download SVG</button>
    </div>
  </form>
</dialog>

<dialog id="helpDlg" class="dlg">
  <form method="dialog" class="dlg-body">
    <h2>Size and thickness are not the same job</h2>
    <div id="helpBody"></div>
    <div class="dlg-actions"><button value="ok" class="primary">Got it</button></div>
  </form>
</dialog>

<script type="module" src="src/main.js"></script>
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "64b33f01984840f982c28feb1569fb91"}'></script><!-- End Cloudflare Web Analytics -->
<!-- Sign in before download. Served from the site, so it is absent when a
     tool is run on its own during development - and absent means export
     works, which is the right way for a funnel to fail. -->
<script type="module" src="/shared/export-gate.js"></script>
</body>
</html>
