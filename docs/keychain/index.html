<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keychain Generator - name keychains for the laser</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#128273;</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">&#9711;</span>
      <input id="projectName" class="name-input" value="Untitled keychain" spellcheck="false" aria-label="Project name">
      <span id="status" class="status">Saved</span>
    </div>

    <div class="midbar">
      <div class="viewtoggle" role="tablist" aria-label="View">
        <!-- The finished piece first, because that is what the tool opens on
             and what somebody is actually deciding about. A selected tab
             sitting at the end of the strip reads as though something else was
             the starting point and this one was picked. -->
        <button class="vt" id="v3d" role="tab" aria-selected="true">3D</button>
        <button class="vt" id="vPiece" role="tab" aria-selected="false">Piece</button>
        <button class="vt" id="vFlat" role="tab" aria-selected="false">Cut file</button>
      </div>
    </div>

    <div class="actions">
      <span class="muted" id="sizeReadout"></span>
      <button class="icon-btn" id="undoBtn" title="Undo (Ctrl+Z)">&#8630;</button>
      <button class="icon-btn" id="redoBtn" title="Redo (Ctrl+Shift+Z)">&#8631;</button>
      <button class="icon-btn" id="helpBtn" title="How a keychain holds together">?</button>
      <button class="soft" id="saveBtn">Save</button>
      <button class="ghost quiet" id="filesBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Reka bentuk saya</button>
      <button class="primary" id="exportBtn">Export</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage" id="stage">
      <div id="stage3d" class="stage-pane"></div>
      <div id="stagePreview" class="stage-pane"></div>
      <div class="backdrop-pick" id="backdropPick" role="group" aria-label="Preview backdrop"></div>
      <div class="warnings" id="warnings" hidden></div>
      <div class="stage-hint" id="stageHint"></div>
    </section>

    <aside class="inspector" id="inspector"></aside>
  </main>
</div>

<dialog id="saveDlg" class="dlg"></dialog>
<dialog id="filesDlg" class="dlg"></dialog>

<dialog id="exportDlg" class="dlg">
  <form method="dialog" class="dlg-body">
    <h2>Export</h2>
    <p class="muted" id="exportSummary"></p>
    <div class="layer-key" id="layerKey"></div>
    <p class="note" id="exportNote"></p>
    <div class="dlg-actions">
      <button value="cancel" class="ghost">Cancel</button>
      <button value="whatsapp" class="ghost wide" id="dlWa">Send WhatsApp</button>
      <button value="pdf" class="ghost wide" id="dlPdf">Download PDF</button>
      <button value="svg" class="primary" id="dlSvg">Download SVG</button>
    </div>
  </form>
</dialog>

<dialog id="helpDlg" class="dlg">
  <form method="dialog" class="dlg-body">
    <h2>How a keychain holds together</h2>
    <div id="helpBody"></div>
    <div class="dlg-actions"><button value="ok" class="primary">Got it</button></div>
  </form>
</dialog>

<script type="module" src="src/main.js"></script>
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "64b33f01984840f982c28feb1569fb91"}'></script><!-- End Cloudflare Web Analytics -->
<!-- Sign in before download. Served from the site, so it is absent when a
     tool is run on its own during development - and absent means export
     works, which is the right way for a funnel to fail. -->
<script type="module" src="/shared/export-gate.js"></script>
</body>
</html>
